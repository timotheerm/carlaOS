[package]
name = "carla-core"
description = "Shared CarlaOS core: catalogue model, scanners and the companion protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
rusqlite = { version = "0.42", features = ["bundled"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
spake2 = "0.4.0"
hmac = "0.12"
getrandom = "0.4.3"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[package]
name = "carla-companion"
description = "CarlaOS desktop companion: reports status and games, prepares streams"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
carla-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
tiny_http = "0.12"
ureq = "3.5"
sysinfo = { version = "0.40", default-features = false, features = ["system", "network"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
